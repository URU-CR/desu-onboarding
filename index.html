<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding — DESÚ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#F6F6F6;
  --paper-alt:#E7E7E7;
  --card:#FFFFFF;
  --ink:#0C1838;
  --ink-soft:#4F4F4F;
  --ink-faint:#888888;
  --line:#E7E7E7;
  --line-strong:#B0B0B0;
  --bronze:#C8900F;
  --bronze-dark:#AF7A00;
  --bronze-tint:#FFF6E1;
  --green:#2E7D32;
  --green-dark:#2A6B2D;
  --green-tint:#E2F6E3;
  --red:#D70C0F;
  --red-tint:#FAE3DE;
  --blue:#00469B;
  --blue-tint:#E2EEF8;
  --font-display:'Roboto',sans-serif;
  --font-body:'Roboto',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:3px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1rem;}
#app{max-width:1080px;margin:0 auto;padding:32px 24px 80px;}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--blue);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
.print-doc{font-size:13.5px;line-height:1.55;}
.print-doc ol{padding-left:20px;}
.print-doc li{margin-bottom:8px;}
@media print{
  .no-print{display:none !important;}
  .print-page{box-shadow:none;border:none;page-break-after:always;}
  body{background:#fff;}
}
.masthead-left h1{font-family:var(--font-display);font-weight:700;font-size:2rem;margin:0 0 4px;letter-spacing:.2px;}
.masthead-left p{margin:0;font-size:13px;color:var(--ink-soft);}
.masthead-right{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-align:right;text-transform:uppercase;letter-spacing:.06em;}

.role-switch{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:22px;}
.role-switch-label{font-size:12px;color:var(--ink-faint);margin-right:2px;}
.role-btn{font-family:var(--font-body);font-size:12.5px;font-weight:500;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);padding:6px 13px;border-radius:16px;cursor:pointer;}
.role-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.employee-banner{background:var(--blue-tint);color:var(--blue);border-radius:var(--radius);padding:10px 16px;font-size:13px;margin-bottom:20px;}

.btn{font-family:var(--font-body);font-size:13.5px;font-weight:500;border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:var(--radius);cursor:pointer;}
.btn:hover{background:var(--ink);color:var(--paper);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#003E8A;border-color:#003E8A;}
.btn-ghost{border-color:var(--line-strong);color:var(--ink-soft);background:transparent;}
.btn-ghost:hover{background:var(--paper-alt);color:var(--ink);}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-delete-tiny{background:none;border:none;color:var(--ink-faint);font-size:11px;padding:2px 4px;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;}
.btn-delete-tiny:hover{color:var(--red);text-decoration-color:var(--red);}
.btn-sm{padding:6px 12px;font-size:12.5px;}

.index-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.index-toolbar h2{font-family:var(--font-display);font-size:1.5rem;font-weight:600;margin:0;}
.index-filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search-clear-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;line-height:1;color:var(--ink-faint);cursor:pointer;padding:2px 6px;}
.search-clear-btn:hover{color:var(--ink);}
.index-filter-row th{padding:0 10px 8px;border-bottom:1px solid var(--line-strong);font-weight:400;}
.export-bar{display:flex;justify-content:space-between;align-items:center;background:var(--paper-alt);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.index-filters input,.index-filters select{padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);font-family:var(--font-body);font-size:13.5px;background:var(--card);color:var(--ink);}
.index-filters input{flex:1;min-width:180px;}
.index-table th[data-sort]{cursor:pointer;user-select:none;}
.index-table th[data-sort]:hover{color:var(--ink);}
.index-table{width:100%;border-collapse:collapse;}
.index-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:500;padding:0 10px 8px;border-bottom:1px solid var(--line-strong);}
.index-row{background:var(--card);cursor:pointer;transition:transform .08s ease;}
.index-row td{padding:14px 10px;border-bottom:1px solid var(--line);font-size:14px;}
.index-row:hover{background:var(--paper-alt);}
.index-name{font-weight:600;}
.btn-quickedit-icon{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink-faint);font-size:13px;width:24px;height:24px;line-height:1;cursor:pointer;}
.btn-quickedit-icon:hover{color:var(--blue);border-color:var(--blue);}
.index-ref{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:12px;font-weight:500;}
.chip-progress-bg{background:var(--paper-alt);color:var(--ink-soft);}
.chip-done{background:var(--green-tint);color:var(--green-dark);}
.chip-blue{background:var(--blue-tint);color:var(--blue);}
.chip-amber{background:var(--bronze-tint);color:var(--bronze-dark);}
.chip-urgent{background:var(--red-tint);color:var(--red);font-weight:500;}
.empty-state{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-soft);}
.empty-state h3{font-family:var(--font-display);font-size:1.25rem;margin:0 0 6px;color:var(--ink);}

.modal-backdrop{position:fixed;inset:0;background:rgba(32,41,58,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--card);border-radius:var(--radius);padding:26px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;border:1px solid var(--line-strong);}
.modal h3{font-family:var(--font-display);margin:0 0 16px;font-size:1.25rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);font-family:var(--font-body);font-size:14px;background:#fff;color:var(--ink);}
.field input,.field select{height:38px;line-height:1.2;}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0px 1000px #fff inset;box-shadow:0 0 0px 1000px #fff inset;transition:background-color 5000s ease-in-out 0s;caret-color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);}
.field input:disabled,.field select:disabled{background:var(--paper-alt);color:var(--ink-faint);cursor:not-allowed;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
.back-link{font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper-alt);}
.back-link:hover{background:var(--blue-tint);border-color:var(--blue);}
.detail-title{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;}
.detail-sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-top:4px;}
.detail-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.stamp{border:2px solid var(--green-dark);color:var(--green-dark);font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;padding:6px 14px;border-radius:40px;transform:rotate(-6deg);text-transform:uppercase;white-space:nowrap;}

.context-strip{display:flex;gap:22px;flex-wrap:wrap;background:var(--paper-alt);border-radius:var(--radius);padding:12px 16px;margin-top:16px;margin-bottom:6px;}
.context-item{font-size:13px;}
.context-item span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:2px;}

.tabs{display:flex;gap:2px;margin-top:22px;flex-wrap:wrap;}
.tab{font-family:var(--font-body);font-weight:500;font-size:14px;padding:11px 22px 10px;background:var(--paper-alt);color:var(--ink-soft);border:1px solid var(--line-strong);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;position:relative;top:1px;}
.tab.active{background:var(--card);color:var(--ink);border-bottom:1px solid var(--card);}
.tab-badge{font-family:var(--font-mono);font-size:10.5px;margin-left:6px;color:var(--ink-faint);}
.panel{background:var(--card);border:1px solid var(--line-strong);border-radius:0 8px 8px 8px;padding:26px 28px;}

.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.progress-track{flex:1;height:6px;background:var(--paper-alt);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--bronze);transition:width .25s ease;}
.progress-fill.complete{background:var(--green);}
.progress-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}

.review-row{display:flex;align-items:center;gap:9px;background:var(--bronze-tint);border-radius:var(--radius);padding:10px 14px;margin-bottom:20px;font-size:13px;color:var(--bronze-dark);}
.review-row.done{background:var(--green-tint);color:var(--green-dark);}
.review-row input{width:16px;height:16px;accent-color:var(--green-dark);}
.readonly-note{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-top:-4px;margin-bottom:10px;}

.field.flagged input,.field.flagged select{border-color:var(--red);background:var(--red-tint);}
.field.missing input,.field.missing select{border-color:var(--red);}
.field.missing > label,.field.missing .field-label-row label{color:var(--red);}
.field-missing-note{color:var(--red);font-size:11.5px;margin-top:4px;}
.field-flag-note{font-size:11.5px;color:var(--red);margin-top:4px;display:flex;align-items:flex-start;gap:4px;}
.flag-toggle{background:none;border:1px solid var(--line-strong);border-radius:12px;cursor:pointer;color:var(--ink-faint);font-size:13px;padding:2px 8px;line-height:1.4;}
.flag-toggle.active{color:#fff;background:var(--red);border-color:var(--red);font-weight:500;}
.field-label-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.essential-dot{color:var(--bronze);font-size:9px;vertical-align:middle;}
.field.essential label{font-weight:600;}
.field.essential input,.field.essential select{border-color:var(--line-strong);box-shadow:inset 2px 0 0 var(--bronze-tint);}
.section-optional-tag{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:400;margin-left:8px;}
.save-status{font-size:12px;color:var(--green-dark);margin-bottom:12px;display:flex;align-items:center;gap:5px;}
.flag-note-input{margin-top:6px;width:100%;padding:6px 8px;font-size:12.5px;border:1px solid var(--red);border-radius:var(--radius);background:#fff;}
.return-banner{background:var(--red-tint);color:var(--red);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;font-size:13.5px;line-height:1.5;}
.return-banner strong{display:block;margin-bottom:4px;}
.hr-status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.repeat-row.flagged{border-color:var(--red);background:var(--red-tint);}
.pending-save-bar{background:var(--bronze-tint);color:var(--bronze-dark);border-radius:var(--radius);padding:8px 10px;font-size:12px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.field-self-error{font-size:11.5px;color:var(--bronze-dark);margin-top:4px;}
.field-self-warning{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-top:4px;}

.form-section{margin-bottom:26px;}
.form-section.locked{opacity:.72;}
.form-section h4{font-family:var(--font-display);font-size:1.125rem;font-weight:600;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.form-section h4.section-incomplete{color:var(--red);border-bottom-color:var(--red);}
.settings-panel-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;gap:10px;}
.settings-panel-head h4{margin:0 0 8px;flex:1;}
.settings-toggle-arrow{color:var(--ink-faint);font-size:12px;transition:transform .15s;flex:0 0 auto;margin-bottom:8px;}
.settings-toggle-arrow.collapsed{transform:rotate(-90deg);}
.settings-panel-body{margin-top:4px;}
.settings-csv-btn{flex:0 0 auto;margin-bottom:8px;}
.form-section-employee{border-left:4px solid var(--blue);background:var(--blue-tint);padding:14px 16px;border-radius:0 var(--radius) var(--radius) 0;}
.form-section-hr{border-left:4px solid var(--bronze);background:var(--bronze-tint);padding:14px 16px;border-radius:0 var(--radius) var(--radius) 0;}
.owner-tag{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;border-bottom:none;padding:2px 8px;border-radius:10px;color:var(--ink-faint);background:var(--paper-alt);}
.form-section-employee .owner-tag{color:var(--blue);background:#fff;}
.form-section-hr .owner-tag{color:var(--bronze-dark);background:#fff;}
.owner-legend{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
.owner-legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.owner-swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}
.owner-swatch-employee{background:var(--blue);}
.owner-swatch-hr{background:var(--bronze);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:12px;}
.form-grid .full{grid-column:1/-1;}
.date-input-group{display:flex;align-items:center;gap:3px;max-width:100%;min-width:0;}
.date-input-group .date-seg{width:34px;min-width:0;flex:0 0 34px;text-align:center;padding:8px 2px;box-sizing:border-box;}
.date-input-group .date-seg-year{width:52px;flex-basis:52px;}
.date-sep{color:var(--ink-faint);flex:0 0 auto;}
.date-input-group .date-cal-btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);width:30px;height:30px;font-size:13px;cursor:pointer;margin-left:2px;flex:0 0 auto;padding:0;}
.date-cal-btn:hover{background:var(--paper-alt);}
.date-picker-popup{position:absolute;z-index:200;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.16);padding:12px;width:270px;}
.date-picker-head{display:flex;gap:6px;margin-bottom:10px;}
.date-picker-head select{flex:1;padding:5px;font-size:13px;}
.date-picker-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.date-picker-nav button{border:none;background:var(--paper-alt);border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:13px;}
.date-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.date-picker-grid .dow{font-size:10.5px;color:var(--ink-faint);text-align:center;padding:2px 0;font-weight:600;}
.date-picker-grid button{border:none;background:none;padding:6px 0;font-size:12.5px;cursor:pointer;border-radius:4px;color:var(--ink);}
.date-picker-grid button:hover{background:var(--blue-tint);}
.date-picker-grid button.outside{color:var(--ink-faint);}
.date-picker-grid button.selected{background:var(--blue);color:#fff;font-weight:600;}
.date-picker-grid button.today{box-shadow:inset 0 0 0 1px var(--blue);}
.date-picker-today-row{margin-top:8px;text-align:center;}
.date-picker-today-row button{border:none;background:none;color:var(--blue);font-size:12px;cursor:pointer;text-decoration:underline;}
.autocomplete-popup{position:absolute;z-index:200;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:260px;overflow-y:auto;padding:4px;}
.autocomplete-popup .ac-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:none;background:none;padding:7px 10px;cursor:pointer;border-radius:4px;}
.autocomplete-popup .ac-item:hover,.autocomplete-popup .ac-item.active{background:var(--blue-tint);}
.autocomplete-popup .ac-main{font-size:13.5px;color:var(--ink);font-weight:600;}
.autocomplete-popup .ac-sub{font-size:12px;color:var(--ink-faint);}

.info-box{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;background:var(--paper-alt);border-radius:var(--radius);padding:14px 16px;margin-bottom:24px;}
.info-box .context-item span{color:var(--ink-soft);}

.repeat-row{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--paper);}
.repeat-row .form-grid{margin-top:0;}
.repeat-empty{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin:6px 0 12px;}

.checklist-section{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.checklist-section.locked{opacity:.65;}
.checklist-section-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--paper-alt);cursor:pointer;user-select:none;}
.checklist-section-head h4{font-family:var(--font-display);font-size:1.125rem;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;}
.checklist-section-count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}
.checklist-body{padding:4px 16px 12px;}
.checklist-body.collapsed{display:none;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--green-dark);cursor:pointer;flex-shrink:0;}
.access-status{margin-top:1px;width:17px;height:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--line-strong);font-size:11px;color:#fff;}
.access-status.done{background:var(--green-dark);border-color:var(--green-dark);}
.access-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap;}
.access-row:last-child{border-bottom:none;}
.access-name{font-weight:500;}
.access-meta{color:var(--ink-faint);font-size:11.5px;}
.access-link{font-size:12px;color:var(--blue);white-space:nowrap;text-decoration:none;}
.access-link:hover{text-decoration:underline;}
.access-desktop-note{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
.check-item input[type=checkbox]:disabled{cursor:not-allowed;}
.check-item-label{flex:1;font-size:13.8px;line-height:1.4;}
.check-item.checked .check-item-label{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--line-strong);}
.check-item-hint{font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:2px;}
.check-item-value{margin-top:6px;width:280px;max-width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--line-strong);border-radius:var(--radius);font-family:var(--font-body);background:#fff;}
.check-item-value:disabled{background:var(--paper-alt);color:var(--ink-faint);}

.wizard-progress{display:flex;gap:6px;margin-bottom:18px;}
.wizard-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:14px;}
.crumb{color:var(--ink-faint);cursor:pointer;padding:2px 5px;border-radius:3px;white-space:nowrap;font-size:12.5px;}
.crumb:hover{color:var(--ink-soft);background:var(--paper-alt);}
.crumb.active{color:var(--ink);font-weight:600;}
.crumb.flagged{color:var(--red);}
.crumb.incomplete{color:var(--red);}
.crumb.incomplete::after{content:' ●';font-size:8px;vertical-align:middle;}
.crumb-sep{color:var(--line-strong);font-size:11px;}
.wizard-dot{height:5px;flex:1;background:var(--paper-alt);border-radius:3px;}
.wizard-dot.active{background:var(--bronze);}
.wizard-dot.done{background:var(--green);}
.wizard-dot.flagged{background:var(--red);}
.wizard-step-title{font-family:var(--font-display);font-size:1.125rem;font-weight:600;margin:0 0 4px;}
.wizard-nav{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}
.wizard-review-msg{background:var(--green-tint);color:var(--green-dark);border-radius:var(--radius);padding:14px 16px;font-size:14px;margin-top:10px;}
.wizard-pending-msg{background:var(--bronze-tint);color:var(--bronze-dark);border-radius:var(--radius);padding:14px 16px;font-size:14px;margin-top:10px;}

.info-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
.info-card{background:var(--paper-alt);border-radius:var(--radius);padding:16px 18px;}
.info-card h4{font-family:var(--font-display);font-size:1.125rem;margin:0 0 8px;}
.info-card p{font-size:13.5px;line-height:1.55;margin:0;color:var(--ink-soft);white-space:pre-wrap;}
.info-card.wide{grid-column:1/-1;}
.contact-group{margin-bottom:12px;}
.contact-group:last-child{margin-bottom:0;}
.contact-group h5{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin:0 0 6px;font-weight:600;}
.contact-person{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line);}
.contact-person:last-child{border-bottom:none;}
.contact-person a{color:var(--blue);text-decoration:none;font-family:var(--font-mono);font-size:12.5px;}
.contact-person a:hover{text-decoration:underline;}
.info-link{display:inline-block;margin-top:10px;font-size:13px;color:var(--blue);}
.info-edit-bar{display:flex;justify-content:flex-end;margin-top:-6px;margin-bottom:14px;}
.info-card textarea{min-height:90px;resize:vertical;}
.contact-edit-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center;}
.contact-edit-row input{padding:6px 8px;font-size:13px;border:1px solid var(--line-strong);border-radius:var(--radius);}

@media(max-width:640px){
  .form-grid{grid-template-columns:1fr;}
  .info-box{grid-template-columns:1fr;}
  .info-cards{grid-template-columns:1fr;}
  .masthead{flex-direction:column;align-items:flex-start;gap:8px;}
  .masthead-right{text-align:left;}
  .detail-head{flex-direction:column;gap:10px;}
  .check-item-value{width:100%;}
  .role-switch{justify-content:flex-start;}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js?v=27"></script>
<script src="app.js?v=27"></script>
</body>
</html>
